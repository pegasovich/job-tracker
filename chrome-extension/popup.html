<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Job Apply AI Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 18px;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #e2e8f0;
      font-size: 12px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      font-size: 12px;
      line-height: 1.4;
    }

    .btn-toggle-visibility,
    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-toggle-visibility:hover,
    .btn-secondary:hover {
      background: #334155;
    }

    .helper-link {
      display: inline-block;
      margin-top: 4px;
      color: #38bdf8;
      font-size: 11px;
      text-decoration: none;
    }

    .helper-link:hover {
      text-decoration: underline;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    #save-status,
    #test-status {
      font-size: 11px;
      margin-top: 6px;
      min-height: 16px;
      text-align: center;
    }

    .status-ok {
      color: var(--success);
    }

    .status-err {
      color: var(--danger);
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .btn-text-small {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .btn-text-small:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">✨</span>
      <h1>Job Apply AI</h1>
    </div>
    <span class="badge">Gemini</span>
  </header>

  <main>
    <!-- API Key Section -->
    <div class="form-group">
      <label for="api-key">Gemini API Key (бесплатный):</label>
      <div class="input-row">
        <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off">
        <button type="button" id="btn-toggle-key" class="btn-toggle-visibility" title="Показать/скрыть">👁️</button>
        <button type="button" id="btn-test-key" class="btn-secondary" title="Проверить ключ">Тест</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="helper-link">👉 Получить бесплатный ключ (AI Studio)</a>
      </div>
      <div id="test-status"></div>
    </div>

    <!-- Candidate Profile Section -->
    <div class="form-group">
      <div class="profile-header">
        <label for="user-profile">О кандидате (опыт, стек, навыки):</label>
        <button type="button" id="btn-reset-profile" class="btn-text-small" title="Восстановить базовый шаблон QA">Шаблон QA</button>
      </div>
      <textarea id="user-profile" placeholder="Опишите ваш опыт, стек инструментов, сильные стороны..."></textarea>
    </div>

    <!-- Settings Row: Language & Tone -->
    <div class="row-2">
      <div class="form-group">
        <label for="letter-lang">Язык отклика:</label>
        <select id="letter-lang">
          <option value="auto">Как в вакансии</option>
          <option value="uk">Украинский</option>
          <option value="en">Английский</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="form-group">
        <label for="letter-tone">Формат отклика:</label>
        <select id="letter-tone">
          <option value="concise">Краткий (3-4 абз.)</option>
          <option value="detailed">Подробный</option>
        </select>
      </div>
    </div>

    <!-- Model selection -->
    <div class="form-group">
      <label for="gemini-model">Модель Gemini:</label>
      <select id="gemini-model">
        <option value="gemini-2.0-flash">Gemini 2.0 Flash (Рекомендуется, 1500 зап./день)</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Быстрая, 1500 зап./день)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Лимит Free Tier: 20 зап./день)</option>
      </select>
    </div>

    <button type="button" id="btn-save" class="btn-primary">💾 Сохранить настройки</button>
    <div id="save-status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
