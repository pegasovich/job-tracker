name: Hourly Remote QA Job Tracker

on:
  schedule:
    # Runs at the top of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write # Grants permissions to commit and push updated jobs_seen.db

jobs:
  track-jobs:
    name: Execute Job Tracker & Alert
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python main.py

      - name: Persist seen jobs database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jobs_seen.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): sync seen jobs database [skip ci]"
            git push origin main
          else
            echo "No new jobs added to database."
          fi
